---
# ArchiConnect AI Deployment Configuration for ai.architex.co.za
# cPanel Deployment Automation - 100% Automated Laravel Setup

deployment:
  tasks:
    # Pre-deployment cleanup and preparation
    - export DEPLOYMENT_PATH=/home/architex/public_html/login.architex.co.za
    - export COMPOSER_ALLOW_SUPERUSER=1
    - export COMPOSER_NO_INTERACTION=1
    - echo "🚀 Starting ArchiConnect deployment to login.architex.co.za..."
    
    # Ensure deployment directory exists
    - mkdir -p $DEPLOYMENT_PATH
    - cd $DEPLOYMENT_PATH
    
    # Copy environment configuration
    - cp .env.production .env
    - echo "✅ Environment configuration copied"
    
    # Install/Update Composer dependencies (production optimized)
    - /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    - echo "✅ Composer dependencies installed"
    
    # Generate application key if not set
    - php artisan key:generate --force
    - echo "✅ Application key configured"
    
    # Clear all caches before setup
    - php artisan config:clear
    - php artisan cache:clear
    - php artisan route:clear
    - php artisan view:clear
    - echo "✅ All caches cleared"
    
    # Database setup and migrations
    - php artisan migrate --force
    - echo "✅ Database migrations completed"
    
    # Storage setup and optimization
    - php artisan storage:link
    - mkdir -p storage/framework/sessions
    - mkdir -p storage/framework/views
    - mkdir -p storage/framework/cache/data
    - mkdir -p storage/logs
    - chmod -R 775 storage
    - chmod -R 775 bootstrap/cache
    - echo "✅ Storage directories configured"
    
    # Cache optimization for production
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - echo "✅ Production caches generated"
    
    # Queue and session tables setup
    - php artisan queue:table --quiet || echo "Queue table exists"
    - php artisan session:table --quiet || echo "Session table exists"
    - php artisan migrate --force
    - echo "✅ Queue and session tables ready"
    
    # Verify frontend assets (built locally)
    - if [ -d "public/build" ]; then echo "✅ Frontend assets found"; else echo "⚠️  No frontend assets found (run preparation script first)"; fi
    
    # Copy and configure .htaccess files
    - cp .htaccess.production .htaccess
    - cp public/.htaccess.production public/.htaccess
    - echo "✅ Web server configuration applied"
    
    # Set proper permissions for shared hosting
    - find . -type f -exec chmod 644 {} \;
    - find . -type d -exec chmod 755 {} \;
    - chmod -R 775 storage
    - chmod -R 775 bootstrap/cache
    - chmod 644 .htaccess
    - chmod 644 public/.htaccess
    - echo "✅ File permissions configured"
    
    # Final cache warming
    - php artisan config:cache
    - php artisan optimize
    - echo "✅ Application optimized"
    
    # Security hardening
    - echo "User-agent: *" > public/robots.txt
    - echo "Disallow: /admin" >> public/robots.txt
    - echo "Disallow: /api" >> public/robots.txt
    - echo "✅ Security measures applied"
    
    # Deployment verification
    - php artisan about --only=environment
    - echo "🎉 ArchiConnect deployment completed successfully!"
    - echo "🌐 Your application is now live at: https://login.architex.co.za"
    - echo "📋 Run verification script at: https://login.architex.co.za/verify-deployment.php"

# Additional deployment settings
exclude:
  - .git/
  - .github/
  - .vscode/
  - node_modules/
  - tests/
  - .env.example
  - .env.testing
  - .gitignore
  - .gitattributes
  - phpunit.xml
  - webpack.mix.js
  - package*.json
  - yarn.lock
  - *.md
  - prepare-*.ps1
  - prepare-*.sh
  - verify-deployment.php
